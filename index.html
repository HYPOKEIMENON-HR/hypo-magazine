<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히포 매거진 | HYPOKEIMENON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FFFFFF;
    --mist:#F4F5F3;
    --line:#E3E4E1;
    --line-soft:#EEEFEC;
    --ink:#14161A;
    --ink-2:#3C4149;
    --muted:#7C8188;
    --faint:#A6AAAF;

    --guide:#2E5E52;
    --news:#17418F;
    --insight:#8A4A2A;

    --danger:#B03A2E;

    --serif:'Gowun Batang', serif;
    --sans:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;

    --maxw:1160px;
    --readw:720px;

    /* 관리자 패널에서 조절 */
    --fs-body:16.5px;
    --fs-h4:19.5px;
    --fs-h3:26px;
    --lh-body:1.85;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation:none !important;transition:none !important}
  }
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  @media(max-width:640px){.wrap{padding:0 18px}}

  /* ===== mono utilities ===== */
  .mono{font-family:var(--mono)}
  .eyebrow{
    font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }
  .code{
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
  }

  /* ===== header ===== */
  header{
    position:sticky;top:0;z-index:80;
    background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .hbar{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand-mark{
    font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;
  }
  .brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}

  nav.gnb{display:flex;align-items:center;gap:4px}
  .nav-item{position:relative}
  .nav-link{
    display:block;padding:22px 14px;font-size:14.5px;font-weight:500;color:var(--ink-2);
    transition:color .15s;
  }
  .nav-link:hover,.nav-link.on{color:var(--ink)}
  .nav-link.on{font-weight:700}
  /* hover bridge so dropdown doesn't flicker */
  .nav-item::after{content:'';position:absolute;left:0;right:0;top:100%;height:10px}
  .drop{
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-6px);
    min-width:172px;background:var(--paper);border:1px solid var(--line);
    padding:8px;opacity:0;visibility:hidden;transition:opacity .16s,transform .16s;
    box-shadow:0 12px 30px rgba(20,22,26,.07);
  }
  .nav-item:hover .drop,.nav-item:focus-within .drop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .drop a{display:block;padding:9px 12px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
  .drop a:hover{background:var(--mist);color:var(--ink)}

  .menu-btn{display:none;font-size:13px;font-family:var(--mono);letter-spacing:.1em;padding:8px 2px}

  #mobileNav{display:none;border-top:1px solid var(--line);background:var(--paper)}
  #mobileNav.open{display:block}
  #mobileNav .mgroup{border-bottom:1px solid var(--line-soft);padding:14px 0}
  #mobileNav .mtitle{font-size:13px;font-weight:700;margin-bottom:6px}
  #mobileNav a{display:block;padding:7px 0;font-size:14px;color:var(--ink-2)}

  @media(max-width:900px){
    nav.gnb{display:none}
    .menu-btn{display:block}
  }

  /* ===== hero (home) ===== */
  .hero{padding:70px 0 20px;border-bottom:1px solid var(--line)}
  .hero-kicker{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .hero-kicker .rule{flex:1;height:1px;background:var(--line)}
  .hero h1{
    font-family:var(--serif);font-weight:700;
    font-size:clamp(30px,4.6vw,54px);line-height:1.28;letter-spacing:-.02em;
    max-width:15ch;
  }
  .hero p.lede{margin-top:20px;max-width:52ch;color:var(--ink-2);font-size:16px}

  /* signature: index rail */
  .rail{margin-top:52px;border-top:1px solid var(--ink);padding-top:0}
  .rail-row{
    display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:baseline;
    padding:20px 0;border-bottom:1px solid var(--line);
    transition:background .15s;
  }
  .rail-row:hover{background:var(--mist)}
  .rail-row .rc{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em}
  .rail-row .rt{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .rail-row .rd{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:60ch}
  .rail-row .rn{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* ===== page header (sections) ===== */
  .phead{padding:58px 0 30px;border-bottom:1px solid var(--ink)}
  .phead .eyebrow{margin-bottom:14px}
  .phead h2{font-family:var(--serif);font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.02em}
  .phead .pdesc{margin-top:14px;color:var(--ink-2);font-size:15px;max-width:62ch}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0;border-bottom:1px solid var(--line)}
  .chip{
    padding:7px 14px;border:1px solid var(--line);font-size:13px;color:var(--muted);
    transition:.15s;
  }
  .chip:hover{border-color:var(--ink-2);color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

  /* ===== card grid ===== */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border-bottom:1px solid var(--line);
  }
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .card{background:var(--paper);padding:26px 24px 30px;text-align:left;display:flex;flex-direction:column;min-height:270px;transition:background .15s}
  .card:hover{background:var(--mist)}
  .card .thumb{
    width:100%;aspect-ratio:16/10;background:var(--mist);margin-bottom:18px;
    background-size:cover;background-position:center;
  }
  .card .meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .card .dot{width:6px;height:6px;border-radius:50%}
  .card .cat{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .card h3{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.42;letter-spacing:-.01em}
  .card .sub{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center}
  .card .foot .d{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .empty{padding:90px 0;text-align:center;color:var(--muted);font-size:14.5px;border-bottom:1px solid var(--line)}
  .empty strong{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:10px;font-weight:700}

  /* ===== webtoon series ===== */
  .toon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:36px 0}
  @media(max-width:820px){.toon-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.toon-grid{grid-template-columns:1fr}}
  .toon-card{text-align:left;border:1px solid var(--line);background:var(--paper);transition:.15s}
  .toon-card:hover{border-color:var(--ink)}
  .toon-cover{aspect-ratio:3/2;background:var(--mist);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center}
  .toon-cover .ph{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}
  .toon-card .tbody{padding:20px}
  .toon-card h3{font-family:var(--serif);font-size:20px;font-weight:700}
  .toon-card p{margin-top:8px;font-size:13.5px;color:var(--muted)}
  .toon-card .cnt{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--faint)}

  .ep-row{
    display:grid;grid-template-columns:70px 96px 1fr auto;gap:18px;align-items:center;
    padding:16px 8px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .15s;
  }
  .ep-row:hover{background:var(--mist)}
  .ep-row .epn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
  .ep-row .epthumb{aspect-ratio:16/10;background:var(--mist);background-size:cover;background-position:center}
  .ep-row .ept{font-size:15px;font-weight:600}
  .ep-row .epd{font-family:var(--mono);font-size:11px;color:var(--faint)}
  @media(max-width:600px){
    .ep-row{grid-template-columns:52px 74px 1fr;gap:12px}
    .ep-row .epd{display:none}
  }

  /* ===== reader overlay ===== */
  .overlay{
    position:fixed;inset:0;z-index:200;background:var(--paper);overflow-y:auto;display:none;
  }
  .overlay.on{display:block}
  .ovbar{
    position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);z-index:5;
  }
  .ovbar .inner{max-width:var(--maxw);margin:0 auto;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .backbtn{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
    white-space:nowrap;flex-shrink:0;min-width:fit-content;padding:8px 0;
  }
  .ovbar .t{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  article.read{max-width:var(--readw);margin:0 auto;padding:56px 28px 120px}
  article.read .ameta{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  article.read h1{font-family:var(--serif);font-size:clamp(26px,3.6vw,38px);font-weight:700;line-height:1.34;letter-spacing:-.02em}
  article.read .asub{margin-top:14px;font-size:17px;color:var(--ink-2);font-family:var(--serif)}
  article.read .abar{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
  article.read .ahero{margin:34px 0;aspect-ratio:16/9;background:var(--mist);background-size:cover;background-position:center}
  .body-copy{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink-2)}
  .body-copy p{margin:0 0 22px}
  .body-copy strong{color:var(--ink);font-weight:700}
  .body-copy h3{font-family:var(--serif);font-size:var(--fs-h3);font-weight:700;color:var(--ink);margin:48px 0 16px;letter-spacing:-.015em;line-height:1.4}
  .body-copy h4{font-size:var(--fs-h4);font-weight:700;color:var(--ink);margin:34px 0 12px;letter-spacing:-.01em;line-height:1.5}
  .body-copy blockquote{border-left:2px solid var(--ink);padding:2px 0 2px 20px;margin:28px 0;color:var(--ink);font-family:var(--serif);font-size:18px}
  .body-copy ul,.body-copy ol{margin:0 0 22px;padding-left:24px}
  .body-copy li{margin-bottom:8px}
  .body-copy a{color:var(--news);text-decoration:underline;text-underline-offset:3px}
  .body-copy img{margin:30px 0;width:100%}

  .notice{
    border:1px solid var(--line);background:var(--mist);padding:16px 18px;margin:0 0 34px;
    font-size:13px;color:var(--ink-2);line-height:1.7;
  }
  .notice b{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

  .toon-view{max-width:840px;margin:0 auto;padding:0 0 100px;background:#fff}
  .toon-view img{width:100%;display:block}
  .toon-nav{display:flex;gap:10px;justify-content:center;padding:34px 20px}
  .toon-nav button{border:1px solid var(--line);padding:12px 22px;font-size:13.5px;font-weight:600;transition:.15s;
    white-space:nowrap;flex-shrink:0;min-width:fit-content}
  .toon-nav button:hover:not(:disabled){border-color:var(--ink)}
  .toon-nav button:disabled{color:var(--faint);cursor:not-allowed}

  /* ===== footer ===== */
  footer{border-top:1px solid var(--ink);margin-top:80px;padding:52px 0 60px}
  .fgrid{display:flex;justify-content:space-between;gap:40px;flex-wrap:wrap}
  footer .fb{font-family:var(--serif);font-size:18px;font-weight:700}
  footer p{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.7}
  .adminlink{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--faint)}
  .adminlink:hover{color:var(--ink)}

  /* ===== admin ===== */
  .modal{position:fixed;inset:0;z-index:300;background:rgba(20,22,26,.45);display:none;
    align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px}
  .modal.on{display:flex}
  .panel{background:var(--paper);width:100%;max-width:760px;border:1px solid var(--line)}
  .panel-head{display:flex;justify-content:space-between;align-items:center;padding:22px 26px;border-bottom:1px solid var(--line)}
  .panel-head h3{font-family:var(--serif);font-size:20px;font-weight:700}
  .panel-body{padding:26px}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:24px}
  .tab{padding:12px 20px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-bottom-color:var(--ink)}
  .field{margin-bottom:16px}
  .field label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
  .field input,.field select,.field textarea{
    width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--paper);font-size:14px;
  }
  .field textarea{min-height:220px;resize:vertical;line-height:1.7;font-family:var(--sans)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
  .hint{font-size:11.5px;color:var(--faint);margin-top:6px;line-height:1.6}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.row2{grid-template-columns:1fr}}
  .btn{padding:12px 22px;font-size:14px;font-weight:600;border:1px solid var(--ink);background:var(--ink);color:#fff;
    white-space:nowrap;flex-shrink:0;min-width:fit-content}
  .btn.ghost{background:transparent;color:var(--ink)}
  .btn.warn{background:transparent;border-color:var(--danger);color:var(--danger)}
  .btn:hover{opacity:.85}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

  .admin-list{border-top:1px solid var(--line);margin-top:30px}
  .admin-item{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 2px;border-bottom:1px solid var(--line-soft)}
  .admin-item .ti{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .admin-item .mi{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
  .admin-item .ab{display:flex;gap:6px;flex-shrink:0}
  .admin-item .ab button{font-size:12px;padding:6px 11px;border:1px solid var(--line);white-space:nowrap}

  .status{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;padding:6px 10px;border:1px solid var(--line);color:var(--muted)}
  .status.live{border-color:var(--guide);color:var(--guide)}
  .status.local{border-color:var(--danger);color:var(--danger)}

  .imgrow{display:flex;gap:8px;margin-bottom:8px}
  .imgrow input{flex:1}
  .imgrow button{border:1px solid var(--line);padding:0 14px;font-size:16px;color:var(--muted)}

  /* ===== 글쓰기 에디터 ===== */
  .etools{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:none;padding:8px;background:var(--mist)}
  .etools button{
    padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ink-2);
    border:1px solid transparent;background:transparent;white-space:nowrap;
  }
  .etools button:hover{background:var(--paper);border-color:var(--line)}
  .etools select{
    padding:6px 8px;font-size:12.5px;font-weight:600;color:var(--ink-2);
    border:1px solid var(--line);background:var(--paper);
  }
  .etools .sep{width:1px;background:var(--line);margin:4px 5px}
  .editor{
    border:1px solid var(--line);min-height:300px;max-height:52vh;overflow-y:auto;
    padding:22px 20px;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink-2);background:var(--paper);
  }
  .editor:focus{outline:none;border-color:var(--ink)}
  .editor:empty::before{content:attr(data-ph);color:var(--faint)}
  .editor h3{font-family:var(--serif);font-size:var(--fs-h3);font-weight:700;color:var(--ink);margin:28px 0 10px;line-height:1.4}
  .editor h4{font-size:var(--fs-h4);font-weight:700;color:var(--ink);margin:22px 0 8px;line-height:1.5}
  .editor p{margin:0 0 14px}
  .editor strong{color:var(--ink)}
  .editor blockquote{border-left:2px solid var(--ink);margin:18px 0;padding-left:16px;font-family:var(--serif);color:var(--ink)}
  .editor ul,.editor ol{margin:0 0 16px;padding-left:22px}
  .editor img{margin:16px 0;border:1px solid var(--line)}
  .editor a{color:var(--news);text-decoration:underline}

  /* ===== 타이포 조절 ===== */
  .slide{display:grid;grid-template-columns:96px 1fr 64px;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line-soft)}
  .slide .sl{font-size:14px;font-weight:600}
  .slide input[type=range]{width:100%;accent-color:var(--ink)}
  .slide .val{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
  .preview{border:1px solid var(--line);padding:26px 24px;margin-top:24px;background:var(--paper);max-height:44vh;overflow-y:auto}
</style>
</head>
<body>

<header>
  <div class="wrap hbar">
    <a class="brand" href="#/home">
      <span class="brand-mark">히포 매거진</span>
      <span class="brand-sub">Hypokeimenon</span>
    </a>

    <nav class="gnb" id="gnb">
      <div class="nav-item"><a class="nav-link" data-sec="home" href="#/home">홈</a></div>
      <div class="nav-item">
        <a class="nav-link" data-sec="guide" href="#/guide/webtoon">히포 가이드</a>
        <div class="drop">
          <a href="#/guide/webtoon">웹툰</a>
          <a href="#/guide/column">칼럼</a>
        </div>
      </div>
      <div class="nav-item">
        <a class="nav-link" data-sec="news" href="#/news/all">HR 뉴스 풀이</a>
        <div class="drop">
          <a href="#/news/all">전체</a>
          <a href="#/news/n_press">뉴스 공유</a>
          <a href="#/news/n_law">법 규정 공유</a>
        </div>
      </div>
      <div class="nav-item">
        <a class="nav-link" data-sec="insight" href="#/insight/all">HR 인사이트</a>
        <div class="drop">
          <a href="#/insight/all">전체</a>
          <a href="#/insight/i_interview">직원 인터뷰</a>

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (

  ));
}
function today(){

function dnum(s){ return Number(String(s||'').replace(/\D/g,'')) || 0; }

  return `${sec.prefix}·${String(i + 1).padStart(2,'0')}`;
}

/* 저장된 HTML에서 위험한 태그·속성 제거 */
function sanitizeHtml(html){
  const box = document.createElement('div');
  box.innerHTML = String(html || '');
  box.querySelectorAll('script,style,iframe,object,embed,form,input').forEach(n => n.remove());
  box.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      const name = a.name.toLowerCase();
      const val = String(a.value || '').trim().toLowerCase();
      if (name.startsWith('on')) n.removeAttribute(a.name);
      if ((name === 'href' || name === 'src') && val.startsWith('javascript:')) n.removeAttribute(a.name);
    });
  });
  box.querySelectorAll('span').forEach(s => {
    const bare = s.textContent.replace(/\u200B/g, '').trim();
    if (!bare && !s.querySelector('img')) s.remove();
  });
  return box.innerHTML.replace(/\u200B/g, '');
}
function looksLikeHtml(s){
  return /<(p|h[1-6]|div|ul|ol|li|blockquote|br|strong|b|em|i|img|a)[\s>/]/i.test(String(s || ''));
}

/* 본문 렌더: 에디터로 쓴 글은 HTML, 예전 글은 마크다운 */
function renderBody(text){
  const src = String(text || '').trim();
  if (!src) return '<p style="color:var(--faint)">본문이 아직 없습니다.</p>';
  if (looksLikeHtml(src)) return sanitizeHtml(src);
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return src.split(/\n\s*\n/).map(block => {
    const b = esc(block.trim());
    if (b.startsWith('&gt; ')) return '<blockquote>' + inline(b.slice(5)) + '</blockquote>';
    if (b.startsWith('### '))  return '<h4>' + inline(b.slice(4)) + '</h4>';
    if (b.startsWith('## '))   return '<h3>' + inline(b.slice(3)) + '</h3>';
    return '<p>' + inline(b.replace(/\n/g, '<br>')) + '</p>';
  }).join('');
}

async function initBackend(){
  const badKey = !SB_KEY || SB_KEY.indexOf('PASTE_YOUR') === 0;
  if (badKey || typeof supabase === 'undefined'){
    online = false;
  } else {
    try{
      sb = supabase.createClient(SB_URL, SB_KEY);
      const { error } = await sb.from('mag_posts').select('id').limit(1);
      if (error) throw error;
      online = true;
    }catch(e){
      console.error('Supabase 연결 실패:', e && (e.message || e.code) || e);
      online = false;
    }
  }
  updateStatus();
}
function updateStatus(){
  const badge = document.getElementById('sbStatus');
  const txt   = document.getElementById('statusText');
  if (online){
    badge.textContent = 'SUPABASE 연결됨';
    badge.className = 'status live';
    txt.textContent = '';
  } else {
    badge.textContent = '로컬 미리보기';
    badge.className = 'status local';
    txt.textContent = 'Supabase 키 미설정 — 저장 내용이 유지되지 않습니다';
  }
}

async function loadAll(){
  if (online){
    try{
      const [p, s, e] = await Promise.all([
        sb.from('mag_posts').select('*'),
        sb.from('mag_series').select('*'),
        sb.from('mag_webtoons').select('*'),
      ]);
      if (p.error) throw p.error;
      if (s.error) throw s.error;
      if (e.error) throw e.error;
      POSTS  = p.data || [];
      SERIES = (s.data || []).sort((a,b) => (a.sort||0) - (b.sort||0));
      EPS    = (e.data || []).map(x => ({...x, images: Array.isArray(x.images) ? x.images : []}));
      if (!SERIES.length) SERIES = SEED_SERIES.map((x,i) => ({...x, id:'seed-s'+i}));
      if (!POSTS.length)  POSTS  = SEED_POSTS.map((x,i) => ({...x, id:'seed-p'+i}));
      return;
    }catch(err){
      console.error('데이터 로드 실패:', err && (err.message || err.code) || err);
      online = false;
      updateStatus();
    }
  }
  POSTS  = SEED_POSTS.map((x,i)  => ({...x, id:'seed-p'+i}));
  SERIES = SEED_SERIES.map((x,i) => ({...x, id:'seed-s'+i}));
  EPS    = [];
}

/* 시드/로컬 항목은 DB에 없는 임시 데이터 — update 대상이 될 수 없다 */
function isTemp(id){ return !id || /^(seed|local)-/.test(String(id)); }

async function savePost(rec, id){
  if (!online){
    if (id){ const i = POSTS.findIndex(p => p.id === id); if (i > -1) POSTS[i] = {...POSTS[i], ...rec}; }
    else POSTS.push({...rec, id:'local-' + Date.now()});
    return true;
  }
  const q = isTemp(id) ? sb.from('mag_posts').insert(rec) : sb.from('mag_posts').update(rec).eq('id', id);
  const { error } = await q;
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function deletePost(id){
  if (!online || isTemp(id)){ POSTS = POSTS.filter(p => p.id !== id); return true; }
  const { error } = await sb.from('mag_posts').delete().eq('id', id);
  if (error){ alert('삭제하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function saveEp(rec, id){
  if (!online){
    if (id){ const i = EPS.findIndex(x => x.id === id); if (i > -1) EPS[i] = {...EPS[i], ...rec}; }
    else EPS.push({...rec, id:'local-' + Date.now()});
    return true;
  }
  const q = isTemp(id) ? sb.from('mag_webtoons').insert(rec) : sb.from('mag_webtoons').update(rec).eq('id', id);
  const { error } = await q;
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function deleteEp(id){
  if (!online || isTemp(id)){ EPS = EPS.filter(x => x.id !== id); return true; }
  const { error } = await sb.from('mag_webtoons').delete().eq('id', id);
  if (error){ alert('삭제하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function saveSeriesCover(seriesKey, cover){
  const row = SERIES.find(s => s.key === seriesKey);
  if (!row) return false;
  row.cover = cover;
  if (!online) return true;
  const { error } = await sb.from('mag_series')
    .upsert({key:seriesKey, name:row.name, blurb:row.blurb || '', cover, sort:row.sort || 0}, {onConflict:'key'});
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return false; }
  return true;
}

/* ============================================================
   타이포그래피 설정
   ============================================================ */
const TYPO_DEFAULT = { body:16.5, h4:19.5, h3:26, lh:1.85 };
let TYPO = {...TYPO_DEFAULT};

function applyTypo(t){
  const r = document.documentElement.style;
  r.setProperty('--fs-body', t.body + 'px');
  r.setProperty('--fs-h4',   t.h4 + 'px');
  r.setProperty('--fs-h3',   t.h3 + 'px');
  r.setProperty('--lh-body', String(t.lh));
}
async function loadTypo(){
  if (!online) return;
  try{
    const { data, error } = await sb.from('mag_settings').select('value').eq('key','typo').maybeSingle();
    if (error) throw error;
    if (data && data.value) TYPO = {...TYPO_DEFAULT, ...data.value};
  }catch(e){
    console.warn('타이포 설정 없음 — 기본값 사용:', e && (e.message || e.code) || e);
  }
}
async function saveTypo(){
  applyTypo(TYPO);
  if (!online){ alert('저장했습니다. (로컬 미리보기 — 새로고침하면 초기화됩니다)'); return; }
  const { error } = await sb.from('mag_settings').upsert({key:'typo', value:TYPO}, {onConflict:'key'});
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return; }
  alert('저장했습니다. 모든 임직원에게 이 크기로 보입니다.');
}

function parseHash(){
  const h = (location.hash || '#/home').replace(/^#\//,'');
  const parts = h.split('/').filter(Boolean);
  return { a: parts[0] || 'home', b: parts[1] || '', c: parts[2] || '' };
}

function render(){
  const { a, b, c } = parseHash();
  const app = document.getElementById('app');
  closeReader(true);
  document.getElementById('mobileNav').classList.remove('open');

  document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('on', n.dataset.sec === a));

  if (a === 'guide')        app.innerHTML = viewGuide(b || 'webtoon');
  else if (a === 'news')    app.innerHTML = viewSection('news', b || 'all');
  else if (a === 'insight') app.innerHTML = viewSection('insight', b || 'all');
  else if (a === 'series')  app.innerHTML = viewSeries(b);
  else                      app.innerHTML = viewHome();

  if (a === 'post' && b) { app.innerHTML = viewHome(); openPost(b); }
  if (a === 'ep'   && b) { app.innerHTML = viewSeries(c || ''); openEp(b); }

  window.scrollTo({top:0, behavior:'auto'});
}
window.addEventListener('hashchange', render);

/* ---- 에디터 ---- */
function initEditor(body){
  const ed = document.getElementById('fBody');
  ed.innerHTML = body ? renderBody(body) : '';

  // 붙여넣기는 항상 순수 텍스트로
  ed.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });

  const tools = document.getElementById('etools');
  // 버튼을 누를 때만 선택 영역을 유지한다 (select는 열려야 하므로 제외)
  tools.addEventListener('mousedown', e => {
    if (e.target.closest('button')) e.preventDefault();
  });
  tools.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    ed.focus();
    if (b.dataset.block){
      const tag = b.dataset.block;
      document.execCommand('formatBlock', false, tag === 'p' ? '<p>' : '<' + tag + '>');
    } else if (b.dataset.cmd){
      document.execCommand(b.dataset.cmd, false, null);
    } else if (b.dataset.act === 'link'){
      const url = prompt('링크 주소를 붙여넣으세요', 'https://');
      if (url) document.execCommand('createLink', false, url);
    } else if (b.dataset.act === 'image'){
      const url = prompt('이미지 URL을 붙여넣으세요 (Cloudinary 등)', 'https://');
      if (url) document.execCommand('insertImage', false, url);
    }
  });

  // 선택 영역 글꼴 / 글자 크기
  const fontSel = document.getElementById('fFont');
  const sizeSel = document.getElementById('fSize');
  let savedRange = null;
  ed.addEventListener('keyup',   () => savedRange = currentRange());
  ed.addEventListener('mouseup', () => savedRange = currentRange());

  fontSel.addEventListener('change', () => {
    const v = fontSel.value; fontSel.value = '';
    if (!v) return;
    restoreRange(savedRange);
    applyInline(ed, {fontFamily: v});
  });
  sizeSel.addEventListener('change', () => {
    const v = sizeSel.value; sizeSel.value = '';
    if (!v) return;
    restoreRange(savedRange);
    applyInline(ed, {fontSize: v + 'pt'});
  });
}

function currentRange(){
  const s = window.getSelection();
  return (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
}
function restoreRange(r){
  if (!r) return;
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

/* 선택 영역이 있으면 그 부분만, 커서만 있으면 이후 입력할 글자에 적용 */
function applyInline(ed, css){
  ed.focus();
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;

  if (sel.isCollapsed){
    const span = document.createElement('span');
    Object.assign(span.style, css);
    span.appendChild(document.createTextNode('\u200B')); // 보이지 않는 자리표시 문자
    sel.getRangeAt(0).insertNode(span);
    const r2 = document.createRange();
    r2.setStart(span.firstChild, 1);
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
    return;
  }

  // execCommand가 남기는 <font size="7">을 표식으로 삼아 span으로 바꿔치기
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('fontSize', false, '7');
  ed.querySelectorAll('font[size="7"]').forEach(f => {
    const span = document.createElement('span');
    Object.assign(span.style, css);
    while (f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
  });
}

function syncCats(preset){
  const sel = document.getElementById('fSection').value;
  const cats = SECTIONS[sel].cats;
  const target = document.getElementById('fCategory');
  const keep = preset || (editingPost && editingPost.category);
  target.innerHTML = cats.map(c => `<option value="${c.key}" ${keep===c.key?'selected':''}>${esc(c.label)}</option>`).join('');
}
async function submitPost(){
  const rec = {
    section:  document.getElementById('fSection').value,
    category: document.getElementById('fCategory').value,
    pub_date: document.getElementById('fDate').value.trim(),
    thumb:    document.getElementById('fThumb').value.trim(),
    title:    document.getElementById('fTitle').value.trim(),
    subtitle: document.getElementById('fSub').value.trim(),
    body:     sanitizeHtml(document.getElementById('fBody').innerHTML).trim(),
  };
  if (!rec.title){ alert('제목을 입력하세요.'); return; }
  if (!rec.body || rec.body === '<br>'){ alert('본문을 입력하세요.'); return; }
  const ok = await savePost(rec, editingPost ? editingPost.id : null);
  if (!ok) return;
  editingPost = null;
  renderAdmin();
}
function editPost(id){
  editingPost = POSTS.find(p => p.id === id) || null;
  renderAdmin();
  document.querySelector('.panel').scrollIntoView({block:'start'});

async function removePost(id){
  if (!confirm('이 글을 삭제할까요? 되돌릴 수 없습니다.')) return;
  await deletePost(id);
  renderAdmin();
}
