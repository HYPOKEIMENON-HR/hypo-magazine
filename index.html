<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히포 매거진 | HYPOKEIMENON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Pen+Script&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --paper:#FFFFFF;
    --mist:#F4F5F3;
    --line:#E3E4E1;
    --line-soft:#EEEFEC;
    --ink:#14161A;
    --ink-2:#3C4149;
    --muted:#7C8188;
    --faint:#A6AAAF;

    --guide:#2E5E52;
    --news:#17418F;
    --insight:#8A4A2A;

    --danger:#B03A2E;

    --serif:'Gowun Batang', serif;
    --sans:'Pretendard Variable', Pretendard, -apple-system, system-ui, sans-serif;
    --mono:'JetBrains Mono', ui-monospace, Menlo, monospace;

    --maxw:1160px;
    --readw:720px;

    /* 관리자 패널에서 조절 */
    --fs-body:16.5px;
    --fs-h4:19.5px;
    --fs-h3:26px;
    --lh-body:1.85;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *{animation:none !important;transition:none !important}
  }
  body{
    font-family:var(--sans);
    background:var(--paper);
    color:var(--ink);
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;border:none;background:none}
  img{display:block;max-width:100%}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px}
  @media(max-width:640px){.wrap{padding:0 18px}}

  /* ===== mono utilities ===== */
  .mono{font-family:var(--mono)}
  .eyebrow{
    font-family:var(--mono);font-size:11px;font-weight:500;
    letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
  }
  .code{
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;
  }

  /* ===== header ===== */
  header{
    position:sticky;top:0;z-index:80;
    background:rgba(255,255,255,.94);
    backdrop-filter:saturate(180%) blur(8px);
    border-bottom:1px solid var(--line);
  }
  .hbar{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand-mark{
    font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.01em;
  }
  .brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.18em;color:var(--faint);text-transform:uppercase}

  nav.gnb{display:flex;align-items:center;gap:4px}
  .nav-item{position:relative}
  .nav-link{
    display:block;padding:22px 14px;font-size:14.5px;font-weight:500;color:var(--ink-2);
    transition:color .15s;
  }
  .nav-link:hover,.nav-link.on{color:var(--ink)}
  .nav-link.on{font-weight:700}
  /* hover bridge so dropdown doesn't flicker */
  .nav-item::after{content:'';position:absolute;left:0;right:0;top:100%;height:10px}
  .drop{
    position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(-6px);
    min-width:172px;background:var(--paper);border:1px solid var(--line);
    padding:8px;opacity:0;visibility:hidden;transition:opacity .16s,transform .16s;
    box-shadow:0 12px 30px rgba(20,22,26,.07);
  }
  .nav-item:hover .drop,.nav-item:focus-within .drop{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
  .drop a{display:block;padding:9px 12px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
  .drop a:hover{background:var(--mist);color:var(--ink)}

  .menu-btn{display:none;font-size:13px;font-family:var(--mono);letter-spacing:.1em;padding:8px 2px}

  #mobileNav{display:none;border-top:1px solid var(--line);background:var(--paper)}
  #mobileNav.open{display:block}
  #mobileNav .mgroup{border-bottom:1px solid var(--line-soft);padding:14px 0}
  #mobileNav .mtitle{font-size:13px;font-weight:700;margin-bottom:6px}
  #mobileNav a{display:block;padding:7px 0;font-size:14px;color:var(--ink-2)}

  @media(max-width:900px){
    nav.gnb{display:none}
    .menu-btn{display:block}
  }

  /* ===== hero (home) ===== */
  .hero{padding:70px 0 20px;border-bottom:1px solid var(--line)}
  .hero-kicker{display:flex;align-items:center;gap:12px;margin-bottom:26px}
  .hero-kicker .rule{flex:1;height:1px;background:var(--line)}
  .hero h1{
    font-family:var(--serif);font-weight:700;
    font-size:clamp(30px,4.6vw,54px);line-height:1.28;letter-spacing:-.02em;
    max-width:15ch;
  }
  .hero p.lede{margin-top:20px;max-width:52ch;color:var(--ink-2);font-size:16px}

  /* signature: index rail */
  .rail{margin-top:52px;border-top:1px solid var(--ink);padding-top:0}
  .rail-row{
    display:grid;grid-template-columns:64px 1fr auto;gap:20px;align-items:baseline;
    padding:20px 0;border-bottom:1px solid var(--line);
    transition:background .15s;
  }
  .rail-row:hover{background:var(--mist)}
  .rail-row .rc{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.06em}
  .rail-row .rt{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:-.01em}
  .rail-row .rd{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:60ch}
  .rail-row .rn{font-family:var(--mono);font-size:11px;color:var(--faint)}

  /* ===== page header (sections) ===== */
  .phead{padding:58px 0 30px;border-bottom:1px solid var(--ink)}
  .phead .eyebrow{margin-bottom:14px}
  .phead h2{font-family:var(--serif);font-size:clamp(26px,3.4vw,40px);font-weight:700;letter-spacing:-.02em}
  .phead .pdesc{margin-top:14px;color:var(--ink-2);font-size:15px;max-width:62ch}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:22px 0;border-bottom:1px solid var(--line)}
  .chip{
    padding:7px 14px;border:1px solid var(--line);font-size:13px;color:var(--muted);
    transition:.15s;
  }
  .chip:hover{border-color:var(--ink-2);color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}

  /* ===== card grid ===== */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
    background:var(--line);border-bottom:1px solid var(--line);
  }
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid{grid-template-columns:1fr}}
  .card{background:var(--paper);padding:26px 24px 30px;text-align:left;display:flex;flex-direction:column;min-height:270px;transition:background .15s}
  .card:hover{background:var(--mist)}
  .card .thumb{
    width:100%;aspect-ratio:16/10;background:var(--mist);margin-bottom:18px;
    background-size:cover;background-position:center;
  }
  .card .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card .meta .d{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .card .dot{width:6px;height:6px;border-radius:50%}
  .card .cat{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .card h3{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.42;letter-spacing:-.01em}
  .card .sub{margin-top:8px;font-size:13.5px;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center}
  .card .foot .d{font-family:var(--mono);font-size:11px;color:var(--faint)}

  .empty{padding:90px 0;text-align:center;color:var(--muted);font-size:14.5px;border-bottom:1px solid var(--line)}
  .empty strong{display:block;font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:10px;font-weight:700}

  /* ===== webtoon series ===== */
  .toon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;padding:36px 0}
  @media(max-width:820px){.toon-grid{grid-template-columns:1fr 1fr}}
  @media(max-width:560px){.toon-grid{grid-template-columns:1fr}}
  .toon-card{text-align:left;border:1px solid var(--line);background:var(--paper);transition:.15s}
  .toon-card:hover{border-color:var(--ink)}
  .toon-cover{aspect-ratio:3/2;background:var(--mist);background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center}
  .toon-cover .ph{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--faint)}
  .toon-card .tbody{padding:20px}
  .toon-card h3{font-family:var(--serif);font-size:20px;font-weight:700}
  .toon-card p{margin-top:8px;font-size:13.5px;color:var(--muted)}
  .toon-card .cnt{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--faint)}

  .ep-row{
    display:grid;grid-template-columns:70px 96px 1fr auto;gap:18px;align-items:center;
    padding:16px 8px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:background .15s;
  }
  .ep-row:hover{background:var(--mist)}
  .ep-row .epn{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--muted)}
  .ep-row .epthumb{aspect-ratio:16/10;background:var(--mist);background-size:cover;background-position:center}
  .ep-row .ept{font-size:15px;font-weight:600}
  .ep-row .epd{font-family:var(--mono);font-size:11px;color:var(--faint)}
  @media(max-width:600px){
    .ep-row{grid-template-columns:52px 74px 1fr;gap:12px}
    .ep-row .epd{display:none}
  }

  /* ===== 홈: 히어로 3분할 ===== */
  .hero-grid{display:grid;grid-template-columns:1.62fr 1fr;gap:16px;padding:34px 0 0}
  @media(max-width:820px){.hero-grid{grid-template-columns:1fr}}
  .hb,.hs{
    position:relative;border:none;text-align:left;overflow:hidden;
    background-size:cover;background-position:center;color:#fff;
    display:flex;align-items:flex-end;transition:transform .25s;
  }
  .hb:hover,.hs:hover{transform:translateY(-2px)}
  .hb{min-height:430px;padding:34px}
  .hb-in{display:block}
  .hb-cat{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:5px 10px;margin-bottom:16px}
  .hb-t{display:block;font-family:var(--serif);font-size:clamp(24px,2.5vw,34px);font-weight:700;line-height:1.32;letter-spacing:-.02em;text-shadow:0 1px 20px rgba(0,0,0,.3)}
  .hb-s{display:block;margin-top:12px;font-size:14.5px;opacity:.88;max-width:46ch}
  .hb-tags{display:block;margin-top:18px;font-size:12px;opacity:.72;letter-spacing:.02em}
  .hs-col{display:grid;grid-template-rows:1fr 1fr;gap:16px}
  .hs{min-height:207px;padding:22px;flex-direction:column;justify-content:flex-end;align-items:flex-start}
  .hs-badge{position:absolute;top:16px;left:16px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
    background:rgba(20,22,26,.5);padding:4px 9px}
  .hs-t{font-size:17px;font-weight:700;line-height:1.45;text-shadow:0 1px 16px rgba(0,0,0,.35)}
  @media(max-width:820px){.hb{min-height:320px}.hs{min-height:150px}}

  /* ===== 홈: 섹션 헤더 ===== */
  .sec-h{margin-bottom:22px}
  .sec-h h2{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:-.01em}
  .sec-h p{font-size:13px;color:var(--muted);margin-top:5px}
  .sec-block{padding:66px 0 0}

  /* ===== 홈: 2단 ===== */
  .two-col{display:grid;grid-template-columns:320px 1fr;gap:64px;padding:66px 0 0}
  @media(max-width:900px){.two-col{grid-template-columns:1fr;gap:52px}}

  .ranklist{list-style:none}
  .ranklist button{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;
    padding:14px 0;border-bottom:1px solid var(--line-soft);transition:opacity .15s}
  .ranklist button:hover{opacity:.6}
  .rk{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--muted);flex-shrink:0;width:14px}
  .rt{font-size:14.5px;font-weight:600;line-height:1.5}
  .rs{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

  .tagbox{display:flex;flex-wrap:wrap;gap:8px}
  .tagpill{border:1px solid var(--line);padding:9px 13px;font-size:13px;color:var(--ink-2);transition:.15s}
  .tagpill:hover{border-color:var(--ink);background:var(--mist)}
  .tagpill span{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:4px}

  .pick{display:flex;gap:24px;align-items:flex-start;width:100%;text-align:left;
    padding:24px 0;border-bottom:1px solid var(--line);transition:opacity .15s}
  .pick:hover{opacity:.62}
  .pick-txt{flex:1;min-width:0}
  .pick-t{display:block;font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.42}
  .pick-s{display:block;margin-top:7px;font-size:13.5px;color:var(--muted);line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pick-m{display:block;margin-top:12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pick-th{width:132px;height:88px;flex-shrink:0;background-size:cover;background-position:center;background-color:var(--mist)}
  @media(max-width:560px){.pick-th{width:92px;height:66px}.pick{gap:16px}}

  /* ===== 홈: 연재 시리즈 ===== */
  .series-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
  .sc{border:1px solid var(--line);display:block;transition:.15s}
  .sc:hover{border-color:var(--ink)}
  .sc-cover{display:block;aspect-ratio:5/3;background-size:cover;background-position:center;background-color:var(--mist)}
  .sc-b{display:block;padding:16px 16px 18px}
  .sc-n{display:block;font-family:var(--serif);font-size:17px;font-weight:700}
  .sc-d{display:block;font-size:12.5px;color:var(--muted);margin-top:5px}
  .sc-c{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    border:1px solid var(--line);padding:4px 8px;color:var(--muted)}

  /* ===== 카드 (SPC 순서) ===== */
  .grid-4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.grid-4{grid-template-columns:1fr}}
  .catpill{font-size:11px;padding:3px 8px;border:1px solid var(--line);letter-spacing:.02em}

  /* ===== reader overlay ===== */
  .overlay{
    position:fixed;inset:0;z-index:200;background:var(--paper);overflow-y:auto;display:none;
  }
  .overlay.on{display:block}
  .ovbar{
    position:sticky;top:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);z-index:5;
  }
  .ovbar .inner{max-width:var(--maxw);margin:0 auto;padding:0 28px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .backbtn{
    display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;
    white-space:nowrap;flex-shrink:0;min-width:fit-content;padding:8px 0;
  }
  .ovbar .t{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  article.read{max-width:var(--readw);margin:0 auto;padding:56px 28px 120px}
  article.read .ameta{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  article.read h1{font-family:var(--serif);font-size:clamp(26px,3.6vw,38px);font-weight:700;line-height:1.34;letter-spacing:-.02em}
  article.read .asub{margin-top:14px;font-size:17px;color:var(--ink-2);font-family:var(--serif)}
  article.read .abar{margin-top:24px;padding-top:18px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--faint)}
  article.read .ahero{margin:34px 0;aspect-ratio:16/9;background:var(--mist);background-size:cover;background-position:center}
  .body-copy{font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink-2)}
  .body-copy p{margin:0 0 22px}
  .body-copy strong{color:var(--ink);font-weight:700}
  .body-copy h3{font-family:var(--serif);font-size:var(--fs-h3);font-weight:700;color:var(--ink);margin:48px 0 16px;letter-spacing:-.015em;line-height:1.4}
  .body-copy h4{font-size:var(--fs-h4);font-weight:700;color:var(--ink);margin:34px 0 12px;letter-spacing:-.01em;line-height:1.5}
  .body-copy blockquote{border-left:2px solid var(--ink);padding:2px 0 2px 20px;margin:28px 0;color:var(--ink);font-family:var(--serif);font-size:18px}
  .body-copy ul,.body-copy ol{margin:0 0 22px;padding-left:24px}
  .body-copy li{margin-bottom:8px}
  .body-copy a{color:var(--news);text-decoration:underline;text-underline-offset:3px}
  .body-copy img{margin:30px 0;max-width:100%;height:auto;display:block}
  .body-copy table{width:100%;border-collapse:collapse;margin:32px 0;font-size:14.5px;line-height:1.6}
  .body-copy th{
    text-align:left;padding:12px 14px;border-bottom:1.5px solid var(--ink);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;
  }
  .body-copy td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink-2)}
  .body-copy tbody tr:hover{background:var(--mist)}
  .body-copy td:first-child{font-family:var(--mono);font-size:12px;color:var(--faint);width:1%;white-space:nowrap}
  @media(max-width:600px){
    .body-copy table{display:block;overflow-x:auto;white-space:nowrap}
  }

  .notice{
    border:1px solid var(--line);background:var(--mist);padding:16px 18px;margin:0 0 34px;
    font-size:13px;color:var(--ink-2);line-height:1.7;
  }
  .notice b{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px}

  /* ===== 목차 ===== */
  .toc{border-top:1px solid var(--ink);border-bottom:1px solid var(--line);padding:20px 0 18px;margin:0 0 44px}
  .toc-h{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .toc a{display:block;padding:5px 0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
  .toc a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
  .toc .toc-h4{padding-left:16px;font-size:13.5px;color:var(--muted)}

  /* ===== 크레딧 · 태그 ===== */
  .credit{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);
    font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}
  .tag{padding:5px 11px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
  .tag::before{content:'#';color:var(--faint);margin-right:2px}

  /* ===== 이전 글 / 다음 글 ===== */
  .pn{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);margin-top:56px;border:1px solid var(--line)}
  .pn-b{background:var(--paper);padding:22px 20px;text-align:left;display:flex;flex-direction:column;gap:8px;transition:background .15s}
  .pn-b:hover{background:var(--mist)}
  .pn-b.right{text-align:right}
  .pn-l{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--faint)}
  .pn-t{font-size:14.5px;font-weight:600;line-height:1.5;

/* ============================================================

const SECTIONS = {
  guide: {
    key:'guide', name:'히포 가이드', en:'HYPO GUIDE', prefix:'G', color:'var(--guide)',
    desc:'당사 규정과 제도를 쉽고 재미있게 안내합니다. 명확한 기준이 있는 내용은 웹툰으로, 배경 설명이 필요한 내용은 칼럼으로 전합니다.',

    cats:[
      {key:'n_press', label:'뉴스 공유', en:'PRESS'},
      {key:'n_law',   label:'법 규정 공유', en:'LAW'},
    ]
  },
  insight: {
    key:'insight', name:'HR 인사이트', en:'HR INSIGHT', prefix:'I', color:'var(--insight)',
    desc:'성장과 협업, 시야를 넓히는 데 도움이 되는 콘텐츠를 모읍니다. 동료의 이야기부터 트렌드와 정책까지, 간접경험의 자리입니다.',
    cats:[

      {key:'i_trend',     label:'트렌드 공유', en:'TREND'},
      {key:'i_policy',    label:'정책 공유', en:'POLICY'},
      {key:'i_review',    label:'리뷰', en:'REVIEW'},
    ]
  }
};
const ALL_CATS = Object.values(SECTIONS).flatMap(s => s.cats.map(c => ({...c, section:s.key})));
function catInfo(key){ return ALL_CATS.find(c => c.key === key) || {key, label:key, en:key, section:'guide'}; }
function secOf(key){ return SECTIONS[catInfo(key).section]; }

/* 법 규정 글 고정 고지 */
const LAW_NOTICE = '이 글은 일반적인 법령 정보를 안내하기 위한 것으로, 히포케이메논의 실제 적용 방침은 별도 공지를 따릅니다. 개별 사안은 인사파트로 문의해 주세요.';

/* ============================================================
   상태
   ============================================================ */
let POSTS  = [];   // {id, section, category, title, subtitle, pub_date, thumb, body}
let SERIES = [];   // {id, key, name, blurb, cover, sort}
let EPS    = [];   // {id, series, ep, title, thumb, images[]}

/* ============================================================
   유틸
   ============================================================ */
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}
function today(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())}`;
}
function dnum(s){ return Number(String(s||'').replace(/\D/g,'')) || 0; }
function sortByDate(list){ return [...list].sort((a,b) => dnum(b.pub_date) - dnum(a.pub_date)); }

/* 글 코드: 섹션별 오래된 순 번호 (G·01, N·03 …) */
function postCode(p){
  const sec = SECTIONS[p.section];
  if (!sec) return '';
  const same = POSTS.filter(x => x.section === p.section).sort((a,b) => dnum(a.pub_date) - dnum(b.pub_date));
  const i = same.findIndex(x => x.id === p.id);
  return `${sec.prefix}·${String(i + 1).padStart(2,'0')}`;
}

/* 저장된 HTML에서 위험한 태그·속성 제거 */
function sanitizeHtml(html){
  const box = document.createElement('div');
  box.innerHTML = String(html || '');
  box.querySelectorAll('script,style,iframe,object,embed,form,input').forEach(n => n.remove());
  box.querySelectorAll('*').forEach(n => {
    [...n.attributes].forEach(a => {
      const name = a.name.toLowerCase();
      const val = String(a.value || '').trim().toLowerCase();
      if (name.startsWith('on')) n.removeAttribute(a.name);
      if ((name === 'href' || name === 'src') && val.startsWith('javascript:')) n.removeAttribute(a.name);
    });
  });
  box.querySelectorAll('img.sel').forEach(i => i.classList.remove('sel'));
  box.querySelectorAll('[class=""]').forEach(n => n.removeAttribute('class'));
  box.querySelectorAll('span').forEach(s => {
    const bare = s.textContent.replace(/\u200B/g, '').trim();
    if (!bare && !s.querySelector('img')) s.remove();
  });
  return box.innerHTML.replace(/\u200B/g, '');
}
function looksLikeHtml(s){
  return /<(p|h[1-6]|div|ul|ol|li|table|tr|td|th|blockquote|br|strong|b|em|i|img|a)[\s>/]/i.test(String(s || ''));
}

/* 본문 렌더: 에디터로 쓴 글은 HTML, 예전 글은 마크다운 */
function renderBody(text){
  const src = String(text || '').trim();
  if (!src) return '<p style="color:var(--faint)">본문이 아직 없습니다.</p>';
  if (looksLikeHtml(src)) return sanitizeHtml(src);
  const inline = s => s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  return src.split(/\n\s*\n/).map(block => {
    const b = esc(block.trim());
    if (b.startsWith('&gt; ')) return '<blockquote>' + inline(b.slice(5)) + '</blockquote>';
    if (b.startsWith('### '))  return '<h4>' + inline(b.slice(4)) + '</h4>';
    if (b.startsWith('## '))   return '<h3>' + inline(b.slice(3)) + '</h3>';
    return '<p>' + inline(b.replace(/\n/g, '<br>')) + '</p>';
  }).join('');
}

async function initBackend(){
  const badKey = !SB_KEY || SB_KEY.indexOf('PASTE_YOUR') === 0;
  if (badKey || typeof supabase === 'undefined'){
    online = false;
  } else {
    try{
      sb = supabase.createClient(SB_URL, SB_KEY);
      const { error } = await sb.from('mag_posts').select('id').limit(1);
      if (error) throw error;
      online = true;
    }catch(e){
      console.error('Supabase 연결 실패:', e && (e.message || e.code) || e);
      online = false;
    }
  }
  updateStatus();
}
function updateStatus(){
  const badge = document.getElementById('sbStatus');
  const txt   = document.getElementById('statusText');
  if (online){
    badge.textContent = 'SUPABASE 연결됨';
    badge.className = 'status live';
    txt.textContent = '';
  } else {
    badge.textContent = '로컬 미리보기';
    badge.className = 'status local';
    txt.textContent = 'Supabase 키 미설정 — 저장 내용이 유지되지 않습니다';
  }
}

/* 웹툰은 기존 사이트가 쓰던 webtoons / series_covers 테이블을 그대로 읽는다.
   webtoons(series, series_label, ep, title, thumb, pages[]) · series_covers(series, cover_url) */
const SERIES_META = {
  life:   { name:'생활수칙', blurb:'근태, 전화 예절, 복장 — 회사 생활의 기본기', sort:1 },
  work:   { name:'업무수칙', blurb:'업무 기본기, 협업과 소통, 정보보안',         sort:2 },
  jisike: { name:'지식',     blurb:'근로계약서, 임금, 연말정산 — 알아두면 쓸모 있는 인사 지식', sort:3 },
};

async function loadAll(){
  if (online){
    try{
      const [p, s, e] = await Promise.all([
        sb.from('mag_posts').select('*'),
        sb.from('series_covers').select('*'),
        sb.from('webtoons').select('*'),
      ]);
      if (p.error) throw p.error;
      if (e.error) throw e.error;

      POSTS = p.data || [];
      if (!POSTS.length) POSTS = SEED_POSTS.map((x,i) => ({...x, id:'seed-p'+i}));

      EPS = (e.data || []).map(x => ({
        id: String(x.id),
        series: x.series,
        ep: x.ep,
        title: x.title,
        thumb: x.thumb || '',
        images: Array.isArray(x.pages) ? x.pages : [],
      }));

      const covers = {};
      (s.data || []).forEach(c => { covers[c.series] = c.cover_url || ''; });
      const keys = [...new Set([...EPS.map(x => x.series), ...Object.keys(covers)])];
      SERIES = keys.map(k => {
        const meta = SERIES_META[k] || { name:k, blurb:'', sort:99 };
        return { key:k, name:meta.name, blurb:meta.blurb, sort:meta.sort, cover:covers[k] || '' };
      }).sort((a,b) => a.sort - b.sort);

      if (!SERIES.length) SERIES = SEED_SERIES.map((x,i) => ({...x, id:'seed-s'+i}));
      return;
    }catch(err){
      console.error('데이터 로드 실패:', err && (err.message || err.code) || err);
      online = false;
      updateStatus();
    }
  }
  POSTS  = SEED_POSTS.map((x,i)  => ({...x, id:'seed-p'+i}));
  SERIES = SEED_SERIES.map((x,i) => ({...x, id:'seed-s'+i}));
  EPS    = [];
}

async function savePost(rec, id){
  if (!online){
    if (id){ const i = POSTS.findIndex(p => p.id === id); if (i > -1) POSTS[i] = {...POSTS[i], ...rec}; }
    else POSTS.push({...rec, id:'local-' + Date.now()});
    return true;
  }
  const q = isTemp(id) ? sb.from('mag_posts').insert(rec) : sb.from('mag_posts').update(rec).eq('id', id);
  const { error } = await q;
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function deletePost(id){
  if (!online || isTemp(id)){ POSTS = POSTS.filter(p => p.id !== id); return true; }
  const { error } = await sb.from('mag_posts').delete().eq('id', id);
  if (error){ alert('삭제하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function saveEp(rec, id){
  if (!online){
    if (id){ const i = EPS.findIndex(x => x.id === id); if (i > -1) EPS[i] = {...EPS[i], ...rec}; }
    else EPS.push({...rec, id:'local-' + Date.now()});
    return true;
  }
  // webtoons 테이블 컬럼명으로 옮긴다 (images → pages, 시리즈 라벨 자동 채움)
  const row = {
    series: rec.series,
    series_label: (SERIES_META[rec.series] || {}).name || rec.series,
    ep: rec.ep,
    title: rec.title,
    thumb: rec.thumb,
    pages: rec.images,
  };
  const q = isTemp(id) ? sb.from('webtoons').insert(row) : sb.from('webtoons').update(row).eq('id', id);
  const { error } = await q;
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function deleteEp(id){
  if (!online || isTemp(id)){ EPS = EPS.filter(x => x.id !== id); return true; }
  const { error } = await sb.from('webtoons').delete().eq('id', id);
  if (error){ alert('삭제하지 못했습니다: ' + (error.message || error.code)); return false; }
  await loadAll();
  return true;
}
async function saveSeriesCover(seriesKey, cover){
  const row = SERIES.find(s => s.key === seriesKey);
  if (!row) return false;
  row.cover = cover;
  if (!online) return true;
  const { error } = await sb.from('series_covers')
    .upsert({series:seriesKey, cover_url:cover}, {onConflict:'series'});
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return false; }
  return true;
}

const TYPO_DEFAULT = { body:16.5, h4:19.5, h3:26, lh:1.85 };
let TYPO = {...TYPO_DEFAULT};

function applyTypo(t){
  const r = document.documentElement.style;
  r.setProperty('--fs-body', t.body + 'px');
  r.setProperty('--fs-h4',   t.h4 + 'px');
  r.setProperty('--fs-h3',   t.h3 + 'px');
  r.setProperty('--lh-body', String(t.lh));
}
async function loadTypo(){
  if (!online) return;
  try{
    const { data, error } = await sb.from('mag_settings').select('value').eq('key','typo').maybeSingle();
    if (error) throw error;
    if (data && data.value) TYPO = {...TYPO_DEFAULT, ...data.value};
  }catch(e){
    console.warn('타이포 설정 없음 — 기본값 사용:', e && (e.message || e.code) || e);
  }
}
async function saveTypo(){
  applyTypo(TYPO);
  if (!online){ alert('저장했습니다. (로컬 미리보기 — 새로고침하면 초기화됩니다)'); return; }
  const { error } = await sb.from('mag_settings').upsert({key:'typo', value:TYPO}, {onConflict:'key'});
  if (error){ alert('저장하지 못했습니다: ' + (error.message || error.code)); return; }
  alert('저장했습니다. 모든 임직원에게 이 크기로 보입니다.');
}

/* ============================================================
   이미지 업로드 — Supabase Storage
   ============================================================ */
const BUCKET = 'mag-images';

/* 파일 하나를 올리고 공개 URL을 돌려준다 */
async function uploadImage(file){
  if (!online){ alert('Supabase에 연결돼 있지 않아 업로드할 수 없습니다.'); return null; }
  if (!file.type.startsWith('image/')){ alert('이미지 파일만 올릴 수 있어요.'); return null; }
  if (file.size > 10 * 1024 * 1024){ alert('10MB 이하 이미지만 올릴 수 있어요.'); return null; }

  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const name = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;

  const { error } = await sb.storage.from(BUCKET).upload(name, file, {cacheControl:'31536000', upsert:false});
  if (error){
    if (/bucket/i.test(error.message || '')){
      alert(`저장소가 없습니다.\n\nSupabase 대시보드 → Storage → New bucket\n이름: ${BUCKET}\nPublic bucket 체크\n\n한 번만 만들면 계속 쓸 수 있어요.`);
    } else {
      alert('업로드하지 못했습니다: ' + (error.message || error.name));
    }
    return null;
  }
  const { data } = sb.storage.from(BUCKET).getPublicUrl(name);
  return data.publicUrl;
}

/* 파일 선택창을 띄우고, 고른 이미지를 올린 뒤 URL을 돌려준다 */
function pickImage(){
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = async () => {
      const f = input.files && input.files[0];
      if (!f) return resolve(null);
      resolve(await uploadImage(f));
    };
    input.click();
  });
}

/* 썸네일 입력칸 + [사진 올리기] 버튼 한 세트 */
function imageField(id, label, value, hint){
  return `
    <div class="field">
      <label>${esc(label)}</label>
      <div class="upload">
        <span class="up-prev" id="${id}_prev" ${value ? `style="background-image:url('${esc(value)}')"` : ''}></span>
        <div class="up-body">
          <button type="button" class="btn ghost up-btn" onclick="uploadTo('${id}')">사진 올리기</button>
          <button type="button" class="up-clear" onclick="clearImg('${id}')">지우기</button>
          <input id="${id}" value="${esc(value || '')}" placeholder="사진을 올리면 주소가 자동으로 채워집니다" oninput="syncPrev('${id}')">
        </div>
      </div>
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`;
}
async function uploadTo(id){
  const btn = document.querySelector(`#${id}`).closest('.upload').querySelector('.up-btn');
  const old = btn.textContent;
  btn.textContent = '올리는 중...';
  btn.disabled = true;
  const url = await pickImage();
  btn.textContent = old;
  btn.disabled = false;
  if (!url) return;
  document.getElementById(id).value = url;
  syncPrev(id);
}
function clearImg(id){
  document.getElementById(id).value = '';
  syncPrev(id);
}
function syncPrev(id){
  const v = document.getElementById(id).value.trim();
  const prev = document.getElementById(id + '_prev');
  if (prev) prev.style.backgroundImage = v ? `url('${v}')` : '';
}

   라우터
   ============================================================ */
function parseHash(){
  const h = (location.hash || '#/home').replace(/^#\//,'');
  const parts = h.split('/').filter(Boolean);
  return { a: parts[0] || 'home', b: parts[1] || '', c: parts[2] || '' };
}

function render(){
  const { a, b, c } = parseHash();
  const app = document.getElementById('app');
  closeReader(true);
  document.getElementById('mobileNav').classList.remove('open');

  document.querySelectorAll('.nav-link').forEach(n => n.classList.toggle('on', n.dataset.sec === a));

  if (a === 'guide')        app.innerHTML = viewGuide(b || 'webtoon');
  else if (a === 'news')    app.innerHTML = viewSection('news', b || 'all');
  else if (a === 'insight') app.innerHTML = viewSection('insight', b || 'all');
  else if (a === 'series')  app.innerHTML = viewSeries(b);
  else if (a === 'tag')     app.innerHTML = viewTag(b);
  else                      app.innerHTML = viewHome();

  if (a === 'post' && b) { app.innerHTML = viewHome(); openPost(b); }
  if (a === 'ep'   && b) { app.innerHTML = viewSeries(c || ''); openEp(b); }
  if (a === 'admin' && !document.getElementById('adminModal').classList.contains('on')) openAdmin();

  window.scrollTo({top:0, behavior:'auto'});
}
window.addEventListener('hashchange', render);

/* 추천 태그 — 많이 쓰인 순, 같으면 최근 글에 붙은 순 */
function tagBar(){
  const count = {}, recent = {};
  POSTS.forEach(p => tagList(p).forEach(t => {
    count[t] = (count[t] || 0) + 1;
    recent[t] = Math.max(recent[t] || 0, dnum(p.pub_date));
  }));
  const top = Object.entries(count)
    .sort((a,b) => b[1] - a[1] || recent[b[0]] - recent[a[0]])
    .slice(0, 8);
  if (!top.length) return '';
  return `
    <div class="sec-h" style="margin-top:44px"><h2>추천 태그</h2><p>주제로 모아 보기</p></div>
    <div class="tagbox">
      ${top.map(([t,n]) => `<a class="tagpill" href="#/tag/${encodeURIComponent(t)}">#${esc(t)} <span>${n}</span></a>`).join('')}
    </div>`;
}

/* 연재 시리즈 — 웹툰 시리즈 + 회차가 붙은 글 묶음 */
function seriesStrip(){
  const cards = [];
  SERIES.forEach(s => {
    const n = EPS.filter(e => e.series === s.key).length;
    if (!n) return;
    cards.push({ href:`#/series/${s.key}`, name:s.name, blurb:s.blurb || '', cover:s.cover, count:`${n}화`, color:'var(--guide)' });
  });
  const byCat = {};
  POSTS.filter(p => p.ep_no).forEach(p => { (byCat[p.category] = byCat[p.category] || []).push(p); });
  Object.entries(byCat).forEach(([cat, list]) => {
    const ci = catInfo(cat);
    const sec = SECTIONS[ci.section];
    cards.push({
      href:`#/${ci.section}/${cat}`, name:ci.label,
      blurb:`${sec.name} 연재`, cover:(sortByDate(list)[0] || {}).thumb || '',
      count:`${list.length}편`, color:sec.color
    });
  });
  if (!cards.length) return '';
  return `
  <section class="sec-block">
    <div class="sec-h"><h2>연재 시리즈</h2><p>회차가 쌓이는 코너들</p></div>
    <div class="series-strip">
      ${cards.map(c => `
        <a class="sc" href="${c.href}">
          <span class="sc-cover" ${c.cover ? `style="background-image:url('${esc(c.cover)}')"` : `style="background:${c.color};opacity:.14"`}></span>
          <span class="sc-b">
            <span class="sc-n">${esc(c.name)}</span>
            <span class="sc-d">${esc(c.blurb)}</span>
            <span class="sc-c">${esc(c.count)}</span>
          </span>
        </a>`).join('')}
    </div>
  </section>`;
}

/* ---- 읽는 시간 / 목차 / 태그 / 관련 글 ---- */
function plainText(html){
  const d = document.createElement('div');
  d.innerHTML = String(html || '');
  return (d.textContent || '').replace(/\s+/g, '');
}
function readMinutes(html){
  const n = plainText(html).length;
  return Math.max(1, Math.round(n / 500)); // 한글 기준 분당 약 500자
}
/* 본문의 제목·소제목에 id를 붙이고 목차 항목을 뽑아낸다 */
function extractToc(html){
  const box = document.createElement('div');
  box.innerHTML = html;
  const items = [];
  box.querySelectorAll('h3,h4').forEach((h, i) => {
    const id = 'sec-' + i;
    h.id = id;
    items.push({id, text: h.textContent.trim(), level: h.tagName.toLowerCase()});
  });
  return { html: box.innerHTML, items };
}
function tagList(p){
  return String(p.tags || '').split(',').map(t => t.trim()).filter(Boolean);
}
/* 태그가 겹치는 글 우선, 모자라면 같은 분류에서 채운다 */
function relatedPosts(p, limit){
  const mine = tagList(p);
  const pool = POSTS.filter(x => x.id !== p.id);
  const scored = pool.map(x => {
    const shared = tagList(x).filter(t => mine.includes(t)).length;
    const sameCat = x.category === p.category ? 1 : 0;
    const sameSec = x.section === p.section ? 1 : 0;
    return { x, score: shared * 10 + sameCat * 3 + sameSec };
  }).filter(s => s.score > 0)
    .sort((a,b) => b.score - a.score || dnum(b.x.pub_date) - dnum(a.x.pub_date));
  return scored.slice(0, limit || 3).map(s => s.x);
}
/* 같은 섹션 안에서 발행일 순 이전 글 / 다음 글 */
function siblingPosts(p){
  const list = POSTS.filter(x => x.section === p.section).sort((a,b) => dnum(a.pub_date) - dnum(b.pub_date));
  const i = list.findIndex(x => x.id === p.id);
  return { prev: list[i-1] || null, next: list[i+1] || null };
}

  document.getElementById('readerBody').innerHTML = `

/* 오버레이를 열고, 항상 맨 위에서 시작한다 */
function openReader(){
  const r = document.getElementById('reader');
  r.classList.add('on');
  document.body.style.overflow = 'hidden';
  r.scrollTop = 0;                       // 이전 글에서 내려간 위치가 남지 않도록
  requestAnimationFrame(() => { r.scrollTop = 0; });  // 렌더 직후 한 번 더
}

function closeReader(silent){
  const r = document.getElementById('reader');
  const wasOpen = r.classList.contains('on');
  r.classList.remove('on');
  document.body.style.overflow = '';
  if (!silent && wasOpen){
    if (history.length > 1) history.back();
    else location.hash = '#/home';
  }
}

  if (e.key === 'Escape'){
    if (document.getElementById('adminModal').classList.contains('on')) closeAdmin();
    else if (document.getElementById('reader').classList.contains('on')) closeReader();
  }
});

/* ---- 에디터 ---- */
function initEditor(body){
  const ed = document.getElementById('fBody');
  ed.innerHTML = body ? renderBody(body) : '';

  // 붙여넣기: 이미지면 업로드, 아니면 순수 텍스트
  ed.addEventListener('paste', async e => {
    const items = [...((e.clipboardData || {}).items || [])];
    const imgItem = items.find(i => i.type && i.type.startsWith('image/'));
    if (imgItem){
      e.preventDefault();
      const url = await uploadImage(imgItem.getAsFile());
      if (url) document.execCommand('insertImage', false, url);
      return;
    }
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });

  // 드래그해서 놓아도 올라간다
  ed.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) e.preventDefault(); });
  ed.addEventListener('drop', async e => {
    const files = [...((e.dataTransfer || {}).files || [])].filter(f => f.type.startsWith('image/'));
    if (!files.length) return;
    e.preventDefault();
    for (const f of files){
      const url = await uploadImage(f);
      if (url) document.execCommand('insertImage', false, url);
    }
  });

  const tools = document.getElementById('etools');
  // 버튼을 누를 때만 선택 영역을 유지한다 (select는 열려야 하므로 제외)
  tools.addEventListener('mousedown', e => {
    if (e.target.closest('button')) e.preventDefault();
  });
  tools.addEventListener('click', async e => {
    const b = e.target.closest('button');
    if (!b) return;
    ed.focus();
    if (b.dataset.block){
      const tag = b.dataset.block;
      document.execCommand('formatBlock', false, tag === 'p' ? '<p>' : '<' + tag + '>');
    } else if (b.dataset.cmd){
      document.execCommand(b.dataset.cmd, false, null);
    } else if (b.dataset.act === 'link'){
      const url = prompt('링크 주소를 붙여넣으세요', 'https://');
      if (url) document.execCommand('createLink', false, url);
    } else if (b.dataset.act === 'image'){
      const saved = currentRange();
      const label = b.textContent;
      b.textContent = '올리는 중...';
      b.disabled = true;
      const url = await pickImage();
      b.textContent = label;
      b.disabled = false;
      if (!url) return;
      ed.focus();
      restoreRange(saved);
      document.execCommand('insertImage', false, url);
    } else if (b.dataset.act === 'table'){
      insertTable();
    }
  });

  // 선택 영역 글꼴 / 글자 크기
  const fontSel = document.getElementById('fFont');
  const sizeSel = document.getElementById('fSize');
  let savedRange = null;
  ed.addEventListener('keyup',   () => savedRange = currentRange());
  ed.addEventListener('mouseup', () => savedRange = currentRange());

  fontSel.addEventListener('change', () => {
    const v = fontSel.value; fontSel.value = '';
    if (!v) return;
    restoreRange(savedRange);
    applyInline(ed, {fontFamily: v});
  });
  sizeSel.addEventListener('change', () => {
    const v = sizeSel.value; sizeSel.value = '';
    if (!v) return;
    restoreRange(savedRange);
    applySize(ed, parseInt(v, 10));
  });

  initImageTools(ed);
}

/* ---- 본문 이미지 크기·정렬 ---- */
function initImageTools(ed){
  const wrap = ed.closest('.editor-wrap');
  const bar = document.getElementById('imgbar');
  const handle = document.getElementById('imghandle');
  let sel = null;

  const widthPct = img => {
    const w = img.style.width;
    if (w && w.endsWith('%')) return Math.round(parseFloat(w));
    return Math.round(img.getBoundingClientRect().width / ed.clientWidth * 100);
  };

  function place(){
    if (!sel){ bar.hidden = true; handle.hidden = true; return; }
    const w = wrap.getBoundingClientRect(), r = sel.getBoundingClientRect();
    const top = r.top - w.top, left = r.left - w.left;

    // 에디터 밖으로 스크롤되면 감춘다
    const e = ed.getBoundingClientRect();
    if (r.bottom < e.top + 4 || r.top > e.bottom - 4){ bar.hidden = true; handle.hidden = true; return; }

    bar.hidden = false; handle.hidden = false;
    const barTop = Math.max(top - bar.offsetHeight - 8, top + 8);
    bar.style.top = barTop + 'px';
    bar.style.left = Math.max(0, Math.min(left, ed.clientWidth - bar.offsetWidth)) + 'px';
    handle.style.top = (top + r.height - 7) + 'px';
    handle.style.left = (left + r.width - 7) + 'px';

    const pct = widthPct(sel);
    document.getElementById('imgpct').textContent = pct + '%';
    bar.querySelectorAll('[data-w]').forEach(b => b.classList.toggle('on', Number(b.dataset.w) === pct));
    const align = sel.style.marginLeft === 'auto'
      ? (sel.style.marginRight === 'auto' ? 'center' : 'right')
      : 'left';
    bar.querySelectorAll('[data-align]').forEach(b => b.classList.toggle('on', b.dataset.align === align));
  }

  function select(img){
    if (sel) sel.classList.remove('sel');
    sel = img;
    sel.classList.add('sel');
    if (!sel.style.width) sel.style.width = '100%';
    place();
  }
  function deselect(){
    if (sel) sel.classList.remove('sel');
    sel = null;
    bar.hidden = true; handle.hidden = true;
  }

  ed.addEventListener('click', e => {
    if (e.target.tagName === 'IMG') select(e.target);
    else deselect();
  });
  ed.addEventListener('scroll', place);
  window.addEventListener('resize', place);

  bar.addEventListener('mousedown', e => e.preventDefault());
  bar.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || !sel) return;
    if (b.dataset.w){
      sel.style.width = b.dataset.w + '%';
    } else if (b.dataset.align){
      const a = b.dataset.align;
      sel.style.display = 'block';
      sel.style.marginLeft  = (a === 'left')   ? '0'    : 'auto';
      sel.style.marginRight = (a === 'right')  ? '0'    : 'auto';
      if (a === 'center'){ sel.style.marginLeft = 'auto'; sel.style.marginRight = 'auto'; }
      if (a === 'right'){  sel.style.marginLeft = 'auto'; sel.style.marginRight = '0'; }
    } else if (b.dataset.act === 'delimg'){
      sel.remove();
      deselect();
      return;
    }
    place();
  });

  // 모서리를 끌어서 자유롭게
  handle.addEventListener('mousedown', e => {
    if (!sel) return;
    e.preventDefault();
    const startX = e.clientX;
    const startW = sel.getBoundingClientRect().width;
    const full = ed.clientWidth;

    const move = ev => {
      const w = startW + (ev.clientX - startX);
      const pct = Math.max(10, Math.min(100, Math.round(w / full * 100)));
      sel.style.width = pct + '%';
      place();
    };
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  });
}

/* 18pt 이상은 문단 자체를 제목 태그로 바꾼다 (목차 추출용)
   24pt 이상 → 제목(h3) · 18~20pt → 소제목(h4) · 그 미만 → 본문 안 글자 크기 */
function applySize(ed, pt){
  ed.focus();
  if (pt < 18){
    // 제목 문단에서 작은 크기를 고르면 본문 문단으로 되돌린다
    if (closestBlock(ed, 'h3') || closestBlock(ed, 'h4')){
      document.execCommand('formatBlock', false, '<p>');
    }
    applyInline(ed, {fontSize: pt + 'pt'});
    return;
  }

  const tag = pt >= 24 ? 'h3' : 'h4';
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('formatBlock', false, '<' + tag + '>');

  const block = closestBlock(ed, tag);
  if (block) block.style.fontSize = pt + 'pt';
}
/* 커서가 놓인 문단 요소 찾기 */
function closestBlock(ed, tag){
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  let n = sel.getRangeAt(0).startContainer;
  if (n.nodeType === 3) n = n.parentNode;
  while (n && n !== ed){
    if (n.tagName && n.tagName.toLowerCase() === tag) return n;
    n = n.parentNode;
  }
  return null;
}

/* 표 삽입 — 첫 행은 머리글. 뉴스 클리핑처럼 링크 표를 만들 때 씁니다 */
function insertTable(){
  const cols = parseInt(prompt('열 개수 (예: 3)', '3'), 10);
  const rows = parseInt(prompt('머리글을 뺀 행 개수 (예: 4)', '4'), 10);
  if (!cols || !rows || cols < 1 || rows < 1 || cols > 8 || rows > 30){
    alert('열은 1~8, 행은 1~30 사이로 넣어 주세요.');
    return;
  }
  const head = '<tr>' + '<th>제목</th>'.repeat(cols) + '</tr>';
  const bodyRows = ('<tr>' + '<td>내용</td>'.repeat(cols) + '</tr>').repeat(rows);
  const html = `<table><thead>${head}</thead><tbody>${bodyRows}</tbody></table><p><br></p>`;
  document.execCommand('insertHTML', false, html);
}

function currentRange(){
  const s = window.getSelection();
  return (s && s.rangeCount) ? s.getRangeAt(0).cloneRange() : null;
}
function restoreRange(r){
  if (!r) return;
  const s = window.getSelection();
  s.removeAllRanges();
  s.addRange(r);
}

/* 선택 영역이 있으면 그 부분만, 커서만 있으면 이후 입력할 글자에 적용 */
function applyInline(ed, css){
  ed.focus();
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return;

  if (sel.isCollapsed){
    const span = document.createElement('span');
    Object.assign(span.style, css);
    span.appendChild(document.createTextNode('\u200B')); // 보이지 않는 자리표시 문자
    sel.getRangeAt(0).insertNode(span);
    const r2 = document.createRange();
    r2.setStart(span.firstChild, 1);
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
    return;
  }

  // execCommand가 남기는 <font size="7">을 표식으로 삼아 span으로 바꿔치기
  document.execCommand('styleWithCSS', false, false);
  document.execCommand('fontSize', false, '7');
  ed.querySelectorAll('font[size="7"]').forEach(f => {
    const span = document.createElement('span');
    Object.assign(span.style, css);
    while (f.firstChild) span.appendChild(f.firstChild);
    f.replaceWith(span);
  });
}

    </div>

      <button class="btn" onclick="submitEp()">${editingEp ? '수정 저장' : '회차 등록'}</button>
      ${editingEp ? `<button class="btn ghost" onclick="editingEp=null;renderAdmin()">새 회차로 전환</button>` : ''}

      ${EPS.length ? EPS.slice().sort((a,b) => (a.series||'').localeCompare(b.series||'') || dnum(a.ep) - dnum(b.ep)).map(x => `

function imgRow(v){
  return `<div class="imgrow"><input class="imgUrl" value="${esc(v||'')}" placeholder="https://..."><button onclick="this.parentElement.remove()">−</button></div>`;
}
function addImgRow(){
  document.getElementById('imgList').insertAdjacentHTML('beforeend', imgRow(''));
}
/* 사진 여러 장을 한 번에 올려 순서대로 줄을 채운다 */
function uploadPages(){
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*'; input.multiple = true;
  input.onchange = async () => {
    const files = [...(input.files || [])];
    if (!files.length) return;
    const list = document.getElementById('imgList');
    // 비어 있는 줄은 먼저 치운다
    list.querySelectorAll('.imgrow').forEach(r => {
      if (!r.querySelector('.imgUrl').value.trim()) r.remove();
    });
    for (let i = 0; i < files.length; i++){
      const url = await uploadImage(files[i]);
      if (url) list.insertAdjacentHTML('beforeend', imgRow(url));
    }
  };
  input.click();
}
async function submitEp(){
  const images = Array.from(document.querySelectorAll('#imgList .imgUrl')).map(i => i.value.trim()).filter(Boolean);
  const rec = {
    series: document.getElementById('eSeries').value,
    ep:     document.getElementById('eEp').value.trim(),
    title:  document.getElementById('eTitle').value.trim(),
    thumb:  document.getElementById('eThumb').value.trim(),

  };

  const ok = await saveEp(rec, editingEp ? editingEp.id : null);
  if (!ok) return;
  editingEp = null;
  renderAdmin();
